# GenJSA — AI provider settings
# Change the model / endpoint in this one place — no code changes needed
# The API key does NOT live in this file — it's read only from the THAILLM_API_KEY environment variable

provider: "thaillm"

model: "openthaigpt"

# Used for work-procedure generation only (backend/app/services/
# procedure_service.py) — writing usable how-to detail is a more demanding
# task than drafting the JSA itself, so that path always uses this thorough
# model when one is configured, falling back to `model` above when blank.
#
# JSA generation used to have its own "วิเคราะห์อย่างละเอียด" toggle that
# switched to this model too — removed because it wrote unnaturally
# over-detailed steps for a JSA, not how a human writes one for real work.
# JSA generation (ai_service.py) never reads this setting now.
detailed_model: "qwen3.6-35b-a3b"

api:
  base_url: "https://thaillm.or.th/api/v1"
  chat_completions_path: "/chat/completions"
  timeout_seconds: 120
  max_tokens: 8192
  temperature: 0.3

# Ask for structured JSON if the server supports it (OpenAI-compatible)
# If the server doesn't recognize this field and answers 400, set this to false and rely on prompt + json repair instead
request_json_mode: true

retry:
  # Number of retries when the returned JSON fails to parse/validate
  max_attempts: 3
  # Delay before retrying (seconds) — avoids hitting the provider's rate limit
  backoff_seconds: 2

# Used only by scripts/model_bench.py — never exposed for the user to choose
candidate_models:
  - "openthaigpt"
  - "pathumma"
  - "typhoon"
  - "thalle"

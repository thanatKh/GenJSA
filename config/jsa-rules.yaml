# GenJSA — JSA generation policy
# These values are injected into the prompt (prompts/jsa-generate.md) at render time
# Adjust here to change AI behavior without touching code or the prompt file

generation:
  # task = top-level work steps | must never be a work instruction like "loosen bolt #1"
  detail_level: "task"
  language: "th"
  # A guideline for the AI, not a hard software limit — complex jobs can have more
  steps_typical_min: 3
  steps_typical_max: 12
  # Above this count, the AI adds an assumption suggesting the job be split into multiple JSAs (doesn't block the user)
  steps_suggest_split_above: 20
  # Users can specify their own steps in work_description — the AI must follow them
  respect_user_defined_steps: true
  # Reasonable number of hazards per step
  hazards_per_step_min: 1
  hazards_per_step_max: 4

# The site's own words. Every AI prompt (JSA and work procedure, built-in and
# the advanced mode's outside-AI one) tells the model to write `use` and never
# any of `instead_of`. Add a line here when the AI keeps using a word your
# site doesn't.
terminology:
  - use: "Check Gas"
    instead_of: ["Gas Test", "Gas Testing"]
  - use: "Work Permit"
    instead_of: ["Permit to Work", "PTW"]
  - use: "คลัง"
    instead_of: ["Tank Farm"]

# Hazard sources the AI must run through for EVERY step before writing that
# step's hazards — it lists only the ones that really apply. This is what
# stops a step from getting just its single most obvious hazard. Shared by the
# built-in AI's prompt and the advanced mode's prompt for outside AIs.
hazard_checklist:
  - "แรงดันและพลังงานสะสม (ของไหลแรงดัน สปริง ไฮดรอลิก นิวแมติก)"
  - "สารไวไฟและแหล่งจุดติดไฟ (ไอน้ำมัน ไฟฟ้าสถิต ประกายไฟ)"
  - "ก๊าซพิษหรือออกซิเจนไม่เพียงพอ (H₂S เบนซีน ไนโตรเจน ไอระเหยสารเคมี)"
  - "สารเคมีสัมผัสผิวหนังหรือกระเด็นเข้าตา"
  - "ไฟฟ้า"
  - "เครื่องจักรหมุน ชิ้นส่วนเคลื่อนที่ จุดหนีบหรือตัด"
  - "ตกจากที่สูงหรือวัตถุตกหล่น"
  - "งานยกและการเคลื่อนย้ายด้วยเครื่องจักร"
  - "ความร้อนหรือความเย็น (พื้นผิวร้อน ไอน้ำ ของเหลวเย็นจัด)"
  - "การยกของด้วยแรงคนและท่าทางการทำงาน"
  - "เสียงดังและความสั่นสะเทือน"
  - "สภาพแวดล้อม (อากาศร้อน ฝน ฟ้าผ่า พื้นลื่น แสงสว่างไม่พอ)"
  - "ยานพาหนะและการจราจรในพื้นที่"
  - "งานอื่นที่ทำพร้อมกันในพื้นที่ (SIMOPS) และบุคคลภายนอก"
  - "การรั่วไหลสู่สิ่งแวดล้อม (ดิน ท่อระบายน้ำ)"

# Topics the AI must "consider while drafting" when relevant to the work
# Note: this is not a review system — there is no AI-based JSA review anymore
# Verification is the job of the supervisor/reviewer, who is a human
consider_when_relevant:
  - "อุปกรณ์ป้องกันส่วนบุคคล (PPE)"
  - "การตัดแยกพลังงานและล็อกป้องกัน (Isolation / LOTO)"
  - "การตรวจวัดก๊าซ (Check Gas)"
  - "การทำงานบนที่สูง"
  - "การทำงานในที่อับอากาศ"
  - "งานที่เกิดประกายไฟหรือความร้อน (Hot Work)"
  - "การเปิดแนวท่อหรือระบบที่มีสารเคมี (Line Breaking)"
  - "งานยกและเครื่องจักรกลหนัก"
  - "การเตรียมพร้อมกรณีฉุกเฉิน"

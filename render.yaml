# GenJSA — Render Blueprint
# This file can be committed to git — no secrets live in it
# Secrets are set in the Render Dashboard -> Environment only

services:
  - type: web
    name: genjsa
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Singapore is closest to Thailand — lowest latency for field workers
    region: singapore
    # PDF is built client-side — the backend has no Chromium, so it's light; starter (512MB) is plenty.
    # On starter (not free) so the instance stays always-on — no 30-60s cold-start
    # wake-up delay for field workers opening the app.
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: THAILLM_API_KEY
        sync: false # Set in the Dashboard — never store in the repo
